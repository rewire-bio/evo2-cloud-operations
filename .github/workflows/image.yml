name: Build runtime image
# Builds container/Dockerfile and pushes it to GHCR. Run manually; the resulting
# digest is then pinned in configs/full.json.
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Free disk space (the CUDA base image is about 25 GB unpacked)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        run: |
          image=ghcr.io/${{ github.repository }}
          docker build --platform linux/amd64 -t "$image:${{ github.sha }}" container
          docker push "$image:${{ github.sha }}"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image:${{ github.sha }}")
          echo "Pinned reference: $digest" | tee -a "$GITHUB_STEP_SUMMARY"
          docker run --rm "$image:${{ github.sha }}" cat /opt/evo2ops/pip-freeze.txt > pip-freeze.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pip-freeze
          path: pip-freeze.txt
